name: Weather Window trmnlp validation
on:
  push:
    branches: [main, feat/weather-ribbon]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-firefox@v1
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          gem install trmnl_preview
          trmnlp version
      - name: Forecast regression checks
        run: node -e "console.log(require('./test/weather.js').checkWeather(require('./src/transform.js').run))"
      - name: Configure public sample location
        run: |
          cat > .trmnlp.yml <<'YAML'
          custom_fields:
            lat_lon: '47.4,8.8'
            location_name: 'Sample location'
            rain_limit: '20'
            minimum_hours: '1'
            units: metric
          YAML
      - name: Lint
        continue-on-error: true
        run: trmnlp lint
      - name: Live polling and HTML diagnostics
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p diagnostics
          trmnlp build 2>&1 | tee diagnostics/live-build.log
      - name: Prepare deterministic sample for layout checks
        run: |
          ruby -ryaml -rjson -e '
            settings = YAML.load_file("src/settings.yml")
            base = (Time.now.to_i / 86400) * 86400
            times = (0..72).map { |i| base + i * 3600 }
            data = {"timezone"=>"UTC", "daily"=>{"sunrise"=>(0..2).map{|i| base+i*86400+6*3600}, "sunset"=>(0..2).map{|i| base+i*86400+18*3600}}, "hourly"=>{"time"=>times, "temperature_2m"=>times.map{20}, "precipitation_probability"=>times.map{0}, "precipitation"=>times.map{0}, "wind_speed_10m"=>times.map{6}, "weather_code"=>times.map{0}}}
            settings["strategy"] = "static"
            settings["static_data"] = JSON.generate(data)
            File.write("src/settings.yml", YAML.dump(settings))
          '
      - name: Render OG sample
        run: |
          trmnlp build --png --width 800 --height 480 --color-depth 1
          mv _build preview-og
      - name: Render X sample
        run: |
          trmnlp build --png --width 1040 --height 780 --color-depth 4
          mv _build preview-x
      - name: Expose Full previews for visual review
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for device in ['og', 'x']:
              path = Path('preview-' + device) / 'full.png'
              print('PREVIEW_' + device.upper() + '=' + base64.b64encode(path.read_bytes()).decode())
          PY
      - name: Save previews and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-window-trmnlp
          path: |
            preview-og/
            preview-x/
            _build/
            diagnostics/
          if-no-files-found: warn
