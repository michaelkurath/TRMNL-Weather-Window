name: Weather Window trmnlp validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-firefox@v1
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          gem install trmnl_preview
          trmnlp version
      - name: Forecast regression checks
        run: node -e "console.log(require('./test/weather.js').checkWeather(require('./src/transform.js').run))"
      - name: Configure public sample location
        run: |
          cat > .trmnlp.yml <<'YAML'
          custom_fields:
            lat_lon: '47.4,8.8'
            location_name: 'Sample location'
            rain_limit: '20'
            minimum_hours: '1'
            units: metric
          YAML
      - name: Lint
        continue-on-error: true
        run: trmnlp lint
      - name: Live polling and HTML diagnostics
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p diagnostics
          trmnlp build 2>&1 | tee diagnostics/live-build.log
      - name: Build and verify TRMNL import ZIP
        run: bin/package.sh dist/weather-window.zip
      - name: Render OG/X stress matrix
        run: |
          mkdir -p matrix
          cases=(realistic imperial_long no_window incomplete insufficient outdated daylight_unavailable service_error)
          for case_name in "${cases[@]}"; do
            ruby test/prepare_fixture.rb "$case_name"
            trmnlp build --png --width 800 --height 480 --color-depth 1
            mv _build "matrix/${case_name}-og"
            trmnlp build --png --width 1040 --height 780 --color-depth 4
            mv _build "matrix/${case_name}-x"
          done
      - name: Validate and compose review sheets
        run: |
          mkdir -p matrix-sheets
          for folder in matrix/*; do
            identify "$folder"/*.png
            name="$(basename "$folder")"
            montage "$folder/full.png" "$folder/half_horizontal.png" "$folder/half_vertical.png" "$folder/quadrant.png" \
              -thumbnail 400x300 -tile 2x2 -geometry +6+18 -set label '%t' "matrix-sheets/${name}.png"
          done
      - name: Expose matrix sheets for visual review
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for path in sorted(Path('matrix-sheets').glob('*.png')):
              key = path.stem.upper().replace('-', '_')
              print('MATRIX_' + key + '=' + base64.b64encode(path.read_bytes()).decode())
          PY
      - name: Save previews and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-window-trmnlp
          path: |
            dist/weather-window.zip
            matrix/
            matrix-sheets/
            _build/
            diagnostics/
          if-no-files-found: warn
